# الفحص الكامل على PostgreSQL حقيقي (محليًا تعمل الاختبارات على PGlite). يفشل الدمج إن فشل أي مرحلة.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fsm
          POSTGRES_PASSWORD: fsm
          POSTGRES_DB: fsm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fsm -d fsm_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # قيم اختبار فقط، لا أسرار
      DATABASE_URL: postgresql://fsm:fsm@localhost:5432/fsm_test
      TEST_DATABASE_URL: postgresql://fsm:fsm@localhost:5432/fsm_test
      APP_URL: http://localhost:3000
      STORAGE_DIR: ./storage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run verify
      - run: npm audit --omit=dev # ثغرات الاعتماديات التي تصل للإنتاج فقط
