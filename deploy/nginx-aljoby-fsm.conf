# /etc/nginx/sites-available/aljoby-fsm  ← ثم ln -s إلى sites-enabled && nginx -t && systemctl reload nginx
# الشهادة: certbot certonly --nginx -d fsm.aljobyfurniture.com (قبل تفعيل خادم 443)
server {
  listen 80;
  server_name fsm.aljobyfurniture.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name fsm.aljobyfurniture.com;
  ssl_certificate     /etc/letsencrypt/live/fsm.aljobyfurniture.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/fsm.aljobyfurniture.com/privkey.pem;

  client_max_body_size 6m; # الصور حتى 5MB

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    # يستبدلان ما يرسله العميل: التطبيق يحسب حد المحاولات بأول عنوان في X-Forwarded-For، فلا يُقبل مزوَّر
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 60s;
  }
}
